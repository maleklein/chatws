services:
  rabbitmq:
    image: rabbitmq:4.1-management   # versión fija: la imagen 4-management actual viene rota (exec format error)
    container_name: chatws-rabbitmq
    command: sh -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    ports:
      - "5672:5672"     # AMQP
      - "61613:61613"   # STOMP (lo usa el relay de Spring)
      - "15672:15672"   # Panel web: http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
